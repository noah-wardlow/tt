name: Deploy tt-server

on:
  push:
    branches: [main]
    paths:
      - "tt-server/**"
      - ".github/workflows/deploy-server.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: tt-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter tt-server --filter tt-shared

      - name: Generate Prisma Client
        run: pnpm --filter tt-server run db:generate

      - name: Typecheck server
        run: pnpm --filter tt-server run typecheck

      - name: Test server
        run: pnpm --filter tt-server run test

      - name: Wrangler deploy dry run
        run: pnpm --filter tt-server exec wrangler deploy --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        run: pnpm --filter tt-server run db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy with Wrangler
        run: pnpm --filter tt-server exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
